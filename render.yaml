# Render Blueprint — déploiement VTC Karim
# Doc: https://render.com/docs/blueprint-spec
# Déploie un Web Service Next.js 16 + base Postgres (Neon, gratuit sans CB).

services:
  - type: web
    name: vtc-driver
    runtime: node
    region: frankfurt # EU, proche de la France
    branch: master
    # Build
    buildCommand: npm install && npm run build
    # Start (Next 16 en mode production)
    startCommand: npm run start
    # Ressources (free tier = 0€, suspendu après inactivité)
    plan: free
    # Variables d'environnement (les SECRETS sont à remplir dans le dashboard Render)
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_PUBLIC_STRIPE_PUBLISHABLE
        value: pk_test_51TkWacBnM9GlS86S4ToFsn3Ul3L5uXJUCxEoNeADoPcwuK85amLI5ncqhLAs9FsVrbIVB4S2pbZSgC2XwcZJbTrL00rw9SWdfW
        sync: false
      - key: STRIPE_SECRET_KEY
        value: sk_tes...Ap9i
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        value: whsec_...KEY
        sync: false
      - key: APP_URL
        value: https://vtc-driver.onrender.com # remplace par ton vrai sous-domaine Render
